# file: destination, where file is saved directly in config/ (e.g. gitconfig: ~/.gitconfig). Notes as # comments.
# file can also be a GitHub URL of a file (.../blob/<ref>/<path>), a directory (.../tree/<ref>/<path>) or a whole repo to clone (https://github.com/<owner>/<repo>).
bash_profile: ~/.bash_profile
vimrc: ~/.vimrc
https://github.com/taiyangc/.claude: ~/.claude
uv.toml: ~/.config/uv/uv.toml
